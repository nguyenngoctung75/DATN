# CI override — dùng với: docker compose -f docker-compose.yml -f docker-compose.ci.yml
#
# Thay thế command của web service để:
#   1. Chạy npm ci (populate node_modules từ package-lock.json, không phụ thuộc named volume)
#   2. Build CSS một lần (không watch)
#   3. Chạy rails server trực tiếp (bỏ foreman/bin/dev vì không cần CSS watch trong CI)
#   4. Chạy solid_queue trong background cùng process

services:
  web:
    image: tool_test_ci_web:latest
    pull_policy: never
    environment:
      RAILS_ENV: development
      CI: "true"
    command: >
      bash -c "
        set -e
        chmod +x bin/* 2>/dev/null || true
        rm -f tmp/pids/server.pid
        echo '[ci] npm ci...'
        npm ci --prefer-offline --no-audit --no-fund --quiet
        echo '[ci] build css...'
        npm run build:css
        echo '[ci] db:prepare...'
        bin/rails db:prepare
        echo '[ci] starting rails server...'
        bin/rails solid_queue:start &
        bin/rails server -b 0.0.0.0 -p 4000
      "
