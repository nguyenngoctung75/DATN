services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    env_file: .env
    environment:
      RAILS_ENV: development
    volumes:
      - .:/rails
      - bundle_cache:/usr/local/bundle
      - node_modules:/rails/node_modules
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      bash -c "
        rm -f tmp/pids/server.pid &&
        bundle check || bundle install &&
        bin/rails db:prepare &&
        bin/dev
      "
    tty: true
    stdin_open: true
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${DATABASE_ROOT_PASSWORD:-123456}
      MYSQL_DATABASE: ${DATABASE_NAME:-tool_test_development}
      MYSQL_USER: ${DATABASE_USERNAME:-tool_test}
      MYSQL_PASSWORD: ${DATABASE_PASSWORD:-123456}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-name-resolve
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/01_grants.sql:ro
    ports:
      - "127.0.0.1:3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  redmine-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: redmine
      POSTGRES_USER: redmine
      POSTGRES_PASSWORD: d22ce56f3658744ef2f48b5c
    volumes:
      - redmine_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U redmine -d redmine"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  redmine:
    image: redmine:5-bookworm
    environment:
      REDMINE_DB_POSTGRES: redmine-db
      REDMINE_DB_PORT: 5432
      REDMINE_DB_DATABASE: redmine
      REDMINE_DB_USERNAME: redmine
      REDMINE_DB_PASSWORD: d22ce56f3658744ef2f48b5c
      REDMINE_SECRET_KEY_BASE: 8970a46892bbca077e13226ef6e6f0bb0d0e3bacc6a1ec3232ef355a7d8f58f8598c54841ab1f694a7b5908577d475d727d4893fbc81e8d7e00191c4051e0270
    ports:
      - "3001:3000"
    depends_on:
      redmine-db:
        condition: service_healthy
    volumes:
      - redmine_files:/usr/src/redmine/files
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  mysql_data:
  bundle_cache:
  node_modules:
  redis_data:
  redmine_db_data:
  redmine_files:
