default: &default
  adapter: mysql2
  encoding: utf8mb4
  collation: utf8mb4_unicode_ci
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host:     <%= ENV.fetch("DATABASE_HOST", "db") %>
  port:     <%= ENV.fetch("DATABASE_PORT", 3306) %>
  username: <%= ENV.fetch("DATABASE_USERNAME") %>
  password: <%= ENV.fetch("DATABASE_PASSWORD") %>
  variables:
    sql_mode: TRADITIONAL

development:
  primary:
    <<: *default
    database: <%= ENV.fetch("DATABASE_NAME", "tool_test_development") %>
  cache:
    <<: *default
    database: <%= ENV.fetch("DATABASE_NAME", "tool_test_development") %>_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *default
    database: <%= ENV.fetch("DATABASE_NAME", "tool_test_development") %>_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *default
    database: <%= ENV.fetch("DATABASE_NAME", "tool_test_development") %>_cable
    migrations_paths: db/cable_migrate

test:
  <<: *default
  database: <%= ENV.fetch("DATABASE_NAME_TEST", "tool_test_test") %>

staging:
  primary:
    <<: *default
    database: <%= ENV.fetch("DATABASE_NAME", "tool_test_staging") %>
  cache:
    <<: *default
    database: <%= ENV.fetch("DATABASE_NAME", "tool_test_staging") %>_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *default
    database: <%= ENV.fetch("DATABASE_NAME", "tool_test_staging") %>_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *default
    database: <%= ENV.fetch("DATABASE_NAME", "tool_test_staging") %>_cable
    migrations_paths: db/cable_migrate
